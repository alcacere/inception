# blackbox.yml (probe definitions)                       READ: docs/10 §5
#
# WRITE under `modules:`
#   https_2xx   prober: http, fail_if_not_ssl: true
#               tls_config: your certificate as CA, or insecure_skip_verify: true
#               (the certificate is self-signed: strict verification fails. Explain your choice)
#   tls_old     prober: http, tls_config max_version: TLS11 → this probe must FAIL
#   tcp         prober: tcp, for port checks (mariadb:3306, nginx:80 → must FAIL)
#   Skip ICMP: it needs an extra capability, and nothing here requires it.
#
# CHECK  probe_tls_version_info shows TLS 1.2 or 1.3

modules:
  https_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 301, 302]
      method: GET
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: true
  tls_old:
    prober: http
    timeout: 5s
    http:
      fail_if_not_ssl: true
      tls_config:
        max_version: "TLS11"
        insecure_skip_verify: true
  tcp_connect:
    prober: tcp
    timeout: 5s