# vsftpd.conf                                            READ: docs/10 §2
#
# WRITE (one `key=value` per line, NO spaces around '=': vsftpd is strict)
#   listen=YES                 background=NO            (PID 1)
#   anonymous_enable=NO        local_enable=YES         write_enable=YES
#   local_umask=022
#   chroot_local_user=YES      allow_writeable_chroot=YES
#   local_root=/var/www/html   (the WordPress volume mount point)
#   pasv_enable=YES  pasv_min_port=21000  pasv_max_port=21010
#   pasv_address=<IP the FTP client uses to reach the VM>   ⚠ NAT pitfall, see docs
#   seccomp_sandbox=NO         (often required inside containers)
#   xferlog_enable=YES  vsftpd_log_file=/dev/stdout   (optional)
#   (outstanding, optional) FTPS: ssl_enable=YES, ssl_tlsv1_2=YES, rsa_cert_file=...
#
# CHECK  curl -u <user>:<pw> ftp://alcacere.42.fr/ → lists the WordPress files
