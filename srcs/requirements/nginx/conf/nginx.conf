# nginx.conf (main context)                              READ: docs/06
#
# WRITE
#   (main)   worker_processes auto;  pid /run/nginx/nginx.pid;
#            error_log /dev/stderr warn;   → visible in `docker logs`
#            daemon off;   (if not given in CMD)  → foreground = PID 1
#   events { worker_connections 1024; }
#   http {
#       include /etc/nginx/mime.types; default_type application/octet-stream;
#       access_log /dev/stdout;
#       server_tokens off;            hide the version
#       sendfile on; keepalive_timeout 65;
#       client_max_body_size 64m;     WordPress media uploads
#       (TLS defaults can go here or in the server block, see the template)
#       include /etc/nginx/http.d/*.conf;   the rendered vhost
#   }
#
# CHECK   docker exec nginx nginx -t
