; www.conf (PHP-FPM pool)                                READ: docs/07
;
; (PHP ini-style: comments start with ';')
;
; WRITE
;   [www]
;   user = <fpm user>          group = <fpm group>
;   listen = 9000              ☠ default 127.0.0.1:9000 → nginx couldn't connect
;   pm = dynamic
;   pm.max_children = ...      pm.start_servers = ...
;   pm.min_spare_servers = ... pm.max_spare_servers = ...
;   clear_env = no             workers can getenv() the container env
;   catch_workers_output = yes PHP errors → docker logs
;   (optional) security.limit_extensions = .php
;
; and in the global section (or php-fpm.conf): error_log = /proc/self/fd/2
;
; CHECK  docker exec wordpress php-fpm84 -t
