# docker-compose.yml                                    READ: docs/04, 05, 10
#
# PURPOSE
#   Declare the whole infrastructure: services, network(s), named volumes, secrets.
#   Called ONLY through the root Makefile.
#
# ☠ EVAL CHECKS ON THIS FILE
#   - must contain `networks`        - no `network_mode: host`, no `links:`
#   - service name == image name     - no `latest` tag, every service has `build:`
#   - restart policy on every service
#
# WRITE: top level
#   name: inception
#
#   services:
#     For EACH service write:
#       build: ./requirements/<svc>        (bonus: ./requirements/bonus/<svc>)
#       image: <svc>:<explicit tag>        e.g. nginx:inception  (same name as the service)
#       pull_policy: build                 never pull a DockerHub image with that name
#       container_name: <svc>
#       restart: unless-stopped | always   (choose one and justify it)
#       networks: [...]
#       env_file / environment             non-secret config only
#       secrets: [...]                     only the ones THIS service needs (least privilege)
#       healthcheck: { test, interval, timeout, retries, start_period }
#       depends_on: { <svc>: { condition: service_healthy } }
#
#     MANDATORY
#       mariadb    volume mariadb:/var/lib/mysql; secrets db_password, db_root_password;
#                  NO ports (only reachable on the internal network)
#       wordpress  volume wordpress:<web root>; secrets db_password, wp_admin_password,
#                  wp_user_password (+ redis_password); depends_on mariadb healthy; NO ports
#       nginx      ports ["443:443"] ← the ONLY entry point; volume wordpress:<same web root>
#                  (read-only is enough: `:ro`); depends_on wordpress healthy
#
#     BONUS (consider `profiles: [bonus]` so `make` = mandatory, `make bonus` = all.
#            Trade-off: wordpress must then cope with redis being absent)
#       redis      secret redis_password; no volume (it's a cache, justify it)
#       ftp        volume wordpress; ports 21 + passive range; secret ftp_password
#       website    no ports if proxied by nginx (/portfolio/)
#       adminer    no ports, proxied by nginx (/adminer/)
#       blackbox   no volumes, no ports, cap_drop [ALL], no-new-privileges, read_only: true
#       prometheus volume prometheus_data:/prometheus; proxied by nginx (/prometheus/)
#
#     HARDENING you can explain (optional, adds "outstanding" points)
#       cap_drop: [ALL] + minimal cap_add, security_opt: [no-new-privileges:true],
#       read_only + tmpfs, init: true where a process forks children (ftp),
#       deploy.resources.limits
#
#   networks:
#     at least one user-defined bridge network, e.g. `inception`.
#     Optional design: a `backend` network with `internal: true` (mariadb, redis,
#     wordpress, adminer, blackbox, prometheus) + a `frontend` (nginx, ftp). Explain why.
#     Blackbox must reach its targets, so it needs the network nginx is on.
#
#   volumes:   (named volumes stored in /home/alcacere/data, see docs/05 §4)
#     mariadb:   driver local, driver_opts { type: none, o: bind, device: ${DATA_PATH}/mariadb }
#     wordpress: same pattern → ${DATA_PATH}/wordpress
#     prometheus_data: (bonus) same pattern or a plain named volume
#
#   secrets:   (file paths are relative to THIS file → ../secrets/...)
#     db_password, db_root_password, wp_admin_password, wp_user_password,
#     ftp_password, redis_password, (opt.) prometheus_basic_auth
#
# CHECK
#   docker compose -f srcs/docker-compose.yml --env-file srcs/.env config   (resolved YAML)
#   docker compose ... ps            → all (healthy)
#   docker volume inspect inception_mariadb | grep device → /home/alcacere/data/mariadb
