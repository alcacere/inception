name: inception

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
      - redis_password
    volumes:
      - wordpress:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wp core is-installed --path=/var/www/html --allow-root || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html:ro
      - certs:/etc/nginx/ssl
    depends_on:
      wordpress:
        condition: service_healthy
      adminer:
        condition: service_healthy
      website:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --no-check-certificate -q --spider https://127.0.0.1:443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    build: ./requirements/bonus/redis
    image: redis:inception
    container_name: redis
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$(cat /run/secrets/redis_password) ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  
  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:inception
    container_name: adminer
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  website:
    build: ./requirements/bonus/website
    image: website:inception
    container_name: website
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:inception
    container_name: ftp
    pull_policy: build
    restart: unless-stopped
    init: true
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wordpress:/var/www/html
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  mariadb:
    name: inception_mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

  wordpress:
    name: inception_wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
  
  certs:
    name: inception_certs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/certs

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  redis_password:
    file: ../secrets/redis_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt